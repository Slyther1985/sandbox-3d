name: Trigger auto deployment for sandbox-3d-ws

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/sandbox-3d-ws-AutoDeployTrigger-09032b9f-5fb6-4b08-aff7-3f6259a253e1.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SANDBOX3DWS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SANDBOX3DWS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SANDBOX3DWS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/server
          dockerfilePath: Dockerfile
          registryUrl: taller3dws.azurecr.io
          registryUsername: ${{ secrets.SANDBOX3DWS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SANDBOX3DWS_REGISTRY_PASSWORD }}
          containerAppName: sandbox-3d-ws
          resourceGroup: azure-signup-rg
          imageToBuild: taller3dws.azurecr.io/sandbox-3d-ws:${{ github.sha }}


